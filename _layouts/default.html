<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title | default: site.github.repository_name }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/gfm.css' | prepend: site.baseurl }}">

    <style>
        body {
            margin: 0;
            background-color: #0d1117;
        }

        @media (prefers-color-scheme: light) {
            body {
                background-color: #ffffff;
            }
        }

        .markdown-body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
            padding: 45px;
        }

        @media (max-width: 767px) {
            .markdown-body {
                padding: 15px;
            }
        }
        @media print {
            @page {
                size: A4;
                margin: 14mm 16mm;
            }

            body {
                background-color: #ffffff;
            }

            .markdown-body {
                color-scheme: light;
                --fgColor-default: #1f2328;
                --fgColor-muted: #59636e;
                --fgColor-accent: #0969da;
                --bgColor-default: #ffffff;
                --borderColor-default: #d1d9e0;
                --borderColor-muted: #d1d9e0b3;
                max-width: none;
                padding: 0;
                font-size: 10pt;
                line-height: 1.4;
            }

            .markdown-body h1 {
                font-size: 18pt;
                margin-bottom: 4pt;
            }

            .markdown-body h2 {
                font-size: 12pt;
                margin-top: 14pt;
            }

            .markdown-body h3 {
                font-size: 11pt;
                margin-top: 12pt;
            }

            .markdown-body h1,
            .markdown-body h2,
            .markdown-body h3 {
                break-after: avoid;
            }

            .markdown-body li,
            .markdown-body p {
                break-inside: avoid;
            }

            .markdown-body a {
                color: inherit;
                text-decoration: none;
            }
        }
    </style>
</head>
<body>
    <article class="markdown-body">
        {{ content }}
    </article>
</body>
</html>
